<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Measurement Parser</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>Measurement Parser</h1>

    <div class="field">
      <label for="type-select">Product type</label>
      <select id="type-select">
        <option value="bag">Bag</option>
        <option value="wallet">Wallet</option>
        <option value="shirt">Shirt</option>
        <option value="tShirt">T-Shirt</option>
        <option value="jacket">Jacket</option>
        <option value="sweater">Sweater</option>
        <option value="coat">Coat</option>
        <option value="dress">Dress</option>
        <option value="dressALine">Dress A-Line</option>
        <option value="dressSleeve">Dress Sleeve</option>
        <option value="tunicSleeve">Tunic Sleeve</option>
        <option value="top">Top</option>
        <option value="skirt">Skirt</option>
        <option value="pants">Pants</option>
        <option value="shorts">Shorts</option>
      </select>
    </div>

    <div class="field">
      <label for="input-text">Paste measurement text</label>
      <textarea
        id="input-text"
        placeholder="ONE SIZE&#9;:&#9;Dimensions: 10.5 x 8.5 cm / Thickness: 2.5 cm"
        spellcheck="false"
      ></textarea>
    </div>

    <div class="toggle-grid">
      <button id="half-btn" class="toggle-btn" title="Halve bust/waist/hem/hip/thigh/knee/ankle opening (original kept as _round)">Take half</button>
      <button id="yuki-btn" class="toggle-btn" title="Parse Yuki (ゆき) as full sleeve instead of sleeve_length">Yuki = arm</button>
      <button id="sleeve-btn" class="toggle-btn" title="Parse &quot;sleeve length&quot;/袖丈/소매길이 as full sleeve instead of sleeve_length">Sleeve = arm</button>
      <button id="table-btn" class="toggle-btn" title="Switch output between JSON and a tab-separated table">Table output</button>
      <button id="kids-btn" class="toggle-btn" title="Mock missing required fields">Kids</button>
      <button id="leggings-btn" class="toggle-btn" title="Send to page also sets attributes.pants_style = &quot;leggings&quot;">Leggings</button>
      <button id="mock-thigh-btn" class="toggle-btn" title="Pants/shorts only: if thigh is missing but hip is present, set predicted_thigh = thigh = hip × 0.6">Mock thigh</button>
      <button id="mock-hip-btn" class="toggle-btn" title="Pants/shorts only: if hip is missing but waist is present, set predicted_hip = hip = waist × 1.35">Mock hip</button>
    </div>

    <button id="parse-btn">Parse</button>
    <button id="load-from-page-btn" class="secondary-btn" title="Read the page's existing sizes/type JSON into the output below">Load sizes from page</button>

    <div id="output-section" class="hidden">
      <div class="output-header">
        <label>JSON output</label>
        <div class="output-actions">
          <button id="copy-btn" class="copy-btn">Copy</button>
          <button id="send-btn" class="copy-btn">Send to page</button>
        </div>
      </div>
      <div class="fix-actions">
        <button id="fix-sleeve-btn" class="copy-btn" title="For every size: sleeve_length = current sleeve, then sleeve = shoulder/2 + sleeve_length">sleeve → sleeve_length</button>
        <button id="fix-sleeve-length-btn" class="copy-btn" title="For every size: sleeve = current sleeve_length, then sleeve_length is removed">sleeve_length → sleeve</button>
        <button id="fix-hem-btn" class="copy-btn" title="For every size: hem = hem / 2 (original kept as hem_round)">Half hem</button>
        <button id="fix-hip-btn" class="copy-btn" title="For every size: hip = hip × 2 (undoes an incorrect halving), and removes the now-stale hip_round">Double hip</button>
        <button id="fix-thigh-btn" class="copy-btn" title="For every size: thigh = thigh × 2 (undoes an incorrect halving), and removes the now-stale thigh_round">Double thigh</button>
        <button id="fix-waist-btn" class="copy-btn" title="For every size: waist = waist × 2 (undoes an incorrect halving), and removes the now-stale waist_round">Double waist</button>
      </div>
      <pre id="output" class="output-compact"></pre>
    </div>

    <div id="error-msg" class="error hidden"></div>

    <hr class="divider" />

    <button id="page-info-btn" title="Scrape name/image/brand/gender (and size chart, if a modal is found) from this product page">Get info from page</button>

    <div id="page-info-section" class="hidden">
      <div class="output-header">
        <label>Page info output</label>
        <div class="output-actions">
          <button id="page-info-copy-btn" class="copy-btn">Copy</button>
        </div>
      </div>
      <pre id="page-info-output" class="output-compact"></pre>
    </div>

    <div id="page-info-error" class="error hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
